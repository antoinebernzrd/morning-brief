name: Update Morning Brief

on:
  schedule:
    - cron: '0 6 * * *'   # 6am UTC = 7am Paris winter / 8am Paris summer
  workflow_dispatch:       # lets you trigger it manually from GitHub too

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news fetcher
        run: python news_fetcher.py

      - name: Commit and push fresh index.html
        run: |
          git config --global user.name  "Morning Brief Bot"
          git config --global user.email "bot@morning-brief.com"
          git add index.html
          git diff --cached --quiet || git commit -m "brief: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
